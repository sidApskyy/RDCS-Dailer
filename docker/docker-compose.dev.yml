services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: rdcs-api-dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    ports:
      - '3001:3001'
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - ../packages/database/prisma:/app/packages/database/prisma
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter @rdcs/api dev

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: rdcs-web-dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    command: pnpm --filter @rdcs/web dev

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      target: development
    container_name: rdcs-worker-dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ../apps/worker:/app/apps/worker
      - ../packages:/app/packages
      - ../packages/database/prisma:/app/packages/database/prisma
      - /app/node_modules
      - /app/apps/worker/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter @rdcs/worker dev

  socket:
    build:
      context: ..
      dockerfile: apps/socket/Dockerfile
      target: development
    container_name: rdcs-socket-dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - REDIS_URL=${REDIS_URL}
    ports:
      - '3002:3002'
    volumes:
      - ../apps/socket:/app/apps/socket
      - ../packages:/app/packages
      - /app/node_modules
      - /app/apps/socket/node_modules
    depends_on:
      redis:
        condition: service_healthy
    command: pnpm --filter @rdcs/socket dev

  nginx:
    image: nginx:1.27-alpine
    container_name: rdcs-nginx-dev
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - socket
